[package]
name = "flow"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", features = ["blocking"] }
nix = { version = "0", features = ["process", "signal", "user"] }
